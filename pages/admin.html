<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Case-Tracking - Admin Spec</title>
  <script src="../assets/js/platform.js"></script>
  <script src="../assets/js/require-admin.js"></script>
  <link rel="stylesheet" href="../assets/css/common.css" />
  <link rel="stylesheet" href="../assets/css/admin.css" />
</head>
<body class="admin">
  <header class="topbar"></header>

  <div class="layout">
    <aside class="sidebar">
      <div class="sidebar-head">
        <h2>หน้าทั้งหมด</h2>
        <button class="btn-sm primary" data-act="add-page">＋ เพิ่มหน้า</button>
      </div>
      <input class="search" id="search" placeholder="🔍 ค้นหาชื่อหน้า / route / module" />
      <div class="page-list" id="pageList"></div>
      <div class="sidebar-foot" id="summary"></div>
    </aside>

    <main class="main">
      <div class="toolbar">
        <div class="tabs">
          <button class="tab" data-view="spec">📄 Spec หน้า</button>
          <button class="tab" data-view="flow">🔀 Flow Diagram</button>
        </div>
        <div class="toolbar-right">
          <span class="saved" id="saved">✓ บันทึกแล้ว</span>
          <button class="btn-sm" data-act="export">⬇ Export JSON</button>
          <label class="btn-sm">⬆ Import JSON<input type="file" id="importFile" accept=".json,application/json" hidden /></label>
        </div>
      </div>

      <section id="specView"></section>
      <section id="flowView" hidden></section>
    </main>
  </div>

  <script src="../assets/js/cases-data.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/announce.js"></script>
  <script src="../assets/js/notify.js"></script>
  <script src="../assets/js/admin.js"></script>
</body>
</html>
