<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Case-Tracking - Spec</title>
  <script src="../assets/js/platform.js"></script>
  <link rel="stylesheet" href="../assets/css/common.css" />
  <link rel="stylesheet" href="../assets/css/cases.css" />
  <link rel="stylesheet" href="../assets/css/spec.css" />
</head>
<body>
  <header class="topbar"></header>

  <main class="page spec-page" id="page"></main>

  <script src="../assets/js/spec-content.js"></script>
  <script src="../assets/js/cases-data.js"></script>
  <script>
    // หน้า Spec เปิดได้โดยไม่ต้อง login — ถ้า login อยู่ โหลดแถบเมนูปกติ, ถ้าไม่ได้ login แสดงหัวแบบย่อ
    (function () {
      var loggedIn = !!(localStorage.getItem("demoUser") || sessionStorage.getItem("demoUser"));
      window.SPEC_LOGGED_IN = loggedIn;
      var list = loggedIn ? ["auth.js", "announce.js", "notify.js", "spec.js"] : ["announce.js", "spec.js"];
      list.forEach(function (f) {
        var s = document.createElement("script");
        s.src = "../assets/js/" + f;
        s.async = false; // รันตามลำดับ
        document.body.appendChild(s);
      });
    })();
  </script>
</body>
</html>
